name: Test TAG relay
# Historical production-lineage contracts retained for audit/tests; these are
# identifiers, not additional branch triggers:
# - v2.8.5-rc6-2-chad-reactivation-gate
# - v2.8.6-rc6-3-full-forecast-contract

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt "pytest>=8,<9"

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run unit tests
        run: python -m pytest -q
