services:
  - type: web
    name: tag-binance-relay-rc2-preview
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: REPAIR_MODE
        value: "false"
      - key: LIVE_COLLECTORS_ENABLED
        value: "true"
      - key: SERVER_JOBS_ENABLED
        value: "true"
      - key: SERVER_JOB_POLL_SECONDS
        value: "5"
      - key: DETERMINISTIC_GRADING_ENABLED
        value: "true"
      - key: PAID_AI_ENABLED
        value: "false"
      - key: BACKFILL_ENABLED
        value: "false"
      - key: OPENAI_AUTOMATIC_ENABLED
        value: "false"
      - key: CHAD_REACTIVATION_ENABLED
        value: "false"
      - key: CHAD_KILL_SWITCH
        value: "true"
      - key: CHAD_FORECAST_WRITES_ENABLED
        value: "false"
      - key: CHAD_GRADING_ENABLED
        value: "false"
      - key: CHAD_CACHE_WRITES_ENABLED
        value: "false"
      - key: OPENAI_PROJECT_BUDGET_CONFIRMED
        value: "false"
      - key: PUSH_ENABLED
        value: "false"
      - key: DB_BOOTSTRAP_ON_START
        value: "true"
      - key: MANUAL_REFRESH_DAILY_LIMIT
        value: "25"
      - key: MANUAL_REFRESH_MONTHLY_LIMIT
        value: "500"
      - key: INTELLIGENCE_READ_DAILY_LIMIT
        value: "25"
      - key: INTELLIGENCE_READ_MONTHLY_LIMIT
        value: "500"
      - key: INTELLIGENCE_READ_TIMEOUT_SECONDS
        value: "8"
      - key: MANUAL_RESPONSE_BUDGET_SECONDS
        value: "24"
      - key: CHAD_DAILY_REQUEST_LIMIT
        value: "0"
      - key: CHAD_MONTHLY_REQUEST_LIMIT
        value: "0"
      - key: OPENAI_DAILY_CALL_LIMIT
        value: "0"
      - key: OPENAI_MONTHLY_CALL_LIMIT
        value: "0"
      - key: OPENAI_AUTO_RESERVE_DAILY
        value: "1"
      - key: OPENAI_AUTO_RESERVE_MONTHLY
        value: "4"
      - key: OPENAI_AUTO_EVENT_COOLDOWN_SECONDS
        value: "21600"
      - key: OPENAI_AUTO_MIN_CONFIRMATIONS
        value: "2"
      - key: CHAD_MIN_REQUEST_INTERVAL_SECONDS
        value: "300"
      - key: CHAD_FORECAST_MIN_INTERVAL_SECONDS
        value: "21600"
      - key: CHAD_REQUEST_DATABASE_QUERY_LIMIT
        value: "40"
      - key: CHAD_REQUEST_DATABASE_WRITE_LIMIT
        value: "12"
      - key: CHAD_REQUEST_EXTERNAL_REQUEST_LIMIT
        value: "20"
      - key: CHAD_REQUEST_OPENAI_CALL_LIMIT
        value: "1"
      - key: CHAD_GRADING_MAX_PER_BATCH
        value: "4"
      - key: FORECAST_GRADE_TOLERANCE_SECONDS
        value: "900"
      - key: CHAD_REGIME_CONFIRMATIONS_REQUIRED
        value: "2"
      - key: CHAD_REGIME_DEBOUNCE_SECONDS
        value: "300"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "4000"
